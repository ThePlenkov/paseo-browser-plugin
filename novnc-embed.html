<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #screen { width: 100%; height: 100%; display: block; }
  #status {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #888; font-family: sans-serif; font-size: 14px; text-align: center;
    z-index: 10;
  }
</style>
<script type="module" crossorigin="anonymous">
  import RFB from './core/rfb.js';

  let rfb;
  let statusEl = document.getElementById('status');
  let screenEl = document.getElementById('screen');

  function status(text) {
    statusEl.textContent = text;
    statusEl.style.display = text ? 'block' : 'none';
  }

  function connectedToServer() {
    status('');
  }

  function disconnectedFromServer(e) {
    if (e.detail.clean) {
      status('Disconnected. Reconnecting...');
    } else {
      status('Connection lost. Reconnecting...');
    }
    setTimeout(connect, 1000);
  }

  function credentialsAreRequired() {
    // No password — shouldn't happen
  }

  function connect() {
    status('Connecting...');

    let url;
    if (window.location.protocol === "https:") {
      url = 'wss';
    } else {
      url = 'ws';
    }
    url += '://' + window.location.host + '/websockify';

    rfb = new RFB(screenEl, url, {});
    rfb.addEventListener("connect", connectedToServer);
    rfb.addEventListener("disconnect", disconnectedFromServer);
    rfb.addEventListener("credentialsrequired", credentialsAreRequired);
    rfb.scaleViewport = true;
    rfb.resizeSession = true;
  }

  connect();
</script>
</head>
<body>
<div id="status">Connecting...</div>
<div id="screen"></div>
</body>
</html>
